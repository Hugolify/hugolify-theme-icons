module:

  mounts:
    - source: layouts
      target: layouts
    # Local assets take precedence over the imported icon modules below, so curated
    # brands (e.g. linkedin, dropped by both Simple Icons and Lucide) fill the gaps.
    # See DESIGN.md §9.
    - source: assets
      target: assets

  imports:

    # Lucide — UI/content icons.
    # Mounted to the role-based path "ui" (not the library name) so the engine
    # stays library-agnostic: swapping Lucide for another set is a one-line change.
    - path: github.com/lucide-icons/lucide
      ignoreConfig: true
      mounts:
        - source: icons
          target: assets/icons/ui

    # Simple Icons — brands.
    - path: github.com/simple-icons/simple-icons
      ignoreConfig: true
      mounts:
        - source: icons
          target: assets/icons/brands

params:
  icons:
    # Stroke weight, in 24x24 viewBox units. Lucide ships 2, which reads heavy
    # at UI sizes: this module deliberately lightens it to 1 and sites raise it
    # if they want more presence. Baked into each glyph at build time (masks are
    # opaque to runtime CSS). See DESIGN.md §5.
    strokeWidth: 1

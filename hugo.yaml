module:

  mounts:
    - source: layouts
      target: layouts

  imports:

    # The default icon sets, one module each. Each mounts its SVGs to
    # assets/icons/<set>/; this engine holds no icon of its own.
    # A site adds a set by importing its module (e.g.
    # github.com/hugolify/hugolify-theme-icons-tabler), and makes it the
    # default with params.icons.set. See DESIGN.md §4.

    # Lucide: UI and content icons, the default set.
    - path: github.com/hugolify/hugolify-theme-icons-lucide

    # Simple Icons: brands, resolved by "brand:name".
    - path: github.com/hugolify/hugolify-theme-icons-simple-icons

params:
  icons:
    # The set that draws the names written without a prefix, among the
    # imported ones: "tabler" makes "ladder" and the themes' own icons (play,
    # pause, map-pin...) Tabler's. Repeated in func/icons/GetDefaultSet.html.
    set: lucide
    # Stroke weight, in 24x24 viewBox units. Lucide ships 2, which reads heavy
    # at UI sizes: this module deliberately lightens it to 1 and sites raise it
    # if they want more presence. Baked into each glyph at build time (masks are
    # opaque to runtime CSS). See DESIGN.md §5.
    strokeWidth: 1
